services:
  navidrome:
    image: deluan/navidrome:latest
    # Run as your server user. Check with: id -u
    user: 1000:1000
    ports:
      # Loopback only: Docker can bypass the host firewall, so never publish on all interfaces.
      # Tailscale exposes this privately via `sudo tailscale serve --bg 4533`.
      - "127.0.0.1:4533:4533"
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
    volumes:
      - "./data:/data"
      - "./music:/music:ro"
